name: Waypoint Enterprise CI Pipeline

on:
  push:
    branches: [ main, dev, ops/deploy, refactor/*, feat/*, fix/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  python_tests:
    name: Python Allocation Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/allocation/requirements.txt
          pip install pytest httpx

      - name: Run pytest assertions
        run: |
          cd packages/allocation
          python -m pytest tests/ -v

  frontend_build:
    name: Frontend Typecheck and Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma Client
        run: pnpm --filter @waypoint/database run db:generate

      - name: Run ESLint
        run: pnpm --filter @waypoint/web run lint

      - name: Run TypeScript typecheck
        run: pnpm --filter @waypoint/web run typecheck

      - name: Run Web Unit Tests
        run: pnpm --filter @waypoint/web run test

      - name: Build Next.js Production App
        run: pnpm --filter @waypoint/web run build
