services:
  postgres:
    image: postgres:16-alpine
    container_name: waypoint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint_logistics}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint_logistics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7.4-alpine
    container_name: waypoint_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  optimizer:
    build:
      context: .
      dockerfile: docker/allocation.Dockerfile
    container_name: waypoint_optimizer
    restart: unless-stopped
    environment:
      PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: waypoint_web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-waypoint}:${POSTGRES_PASSWORD:-waypoint_secret_2026}@postgres:5432/${POSTGRES_DB:-waypoint_logistics}?schema=public
      REDIS_URL: redis://redis:6379
      OPTIMIZER_URL: http://optimizer:8000
      JWT_SECRET: ${JWT_SECRET:-waypoint_jwt_super_secure_2026_key}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      optimizer:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  caddy:
    image: caddy:2.8-alpine
    container_name: waypoint_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
